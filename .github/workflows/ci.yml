name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Ubuntu 24.04 includes Node 22; reject a changed image default.
      - name: Verify Node 22
        run: |
          node -e 'if (process.versions.node.split(".")[0] !== "22") throw new Error("CI requires Node 22")'
          node --version
          npm --version

      - run: npm ci
      - run: npm run build
      - run: npm test
